<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Labirint</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/x-icon" href="img/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="main">
    <div class="opis">
      <div class="naslov">
        <h1>Labirint</h1>
        <p>Za premikanje uporabi puščice na tipkovnici</p>
      </div>
    </div>

    <div class="labirint">
      <div id="game" class="game" tabindex="0" aria-label="Labirint">
        <canvas id="canvas" width="720" height="720"></canvas>
      </div>
    </div>

    <div class="opis">
      <div class="buttons">
        <button id="nov">Nova igra</button>
        <button id="reset" class="siv">Reset</button>
        <button id="vizitka" class="siv">Vizitka</button>
      </div>

      <div class="hud">
        <div class="zapis" id="banane">🍌 0/0</div>
        <div class="zapis" id="koraki">Koraki: 0</div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
